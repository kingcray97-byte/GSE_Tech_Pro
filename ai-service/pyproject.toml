[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-service"
version = "0.4.0"
description = "GSE Tech Pro local AI service (FastAPI on 127.0.0.1): technician chat, manual RAG, ingestion, tools. Offline only."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "litellm>=1.40",
    "keyring>=24",  # ADR-013: route keys from Windows Credential Manager
    "httpx>=0.27",
    "pydantic>=2.6",
    "sqlite-vec>=0.1.6",
    "pypdf>=4.0",
    "cryptography>=42",  # pypdf needs it to open AES-encrypted manuals (owner-protected, empty user password)
    "pyyaml>=6.0",
    "numpy>=1.26",
    # Phase 7.6 scanned-page OCR: pdfium renders the page (BSD-3/Apache-2.0, ADR-005), Windows.Media.Ocr reads it
    # through pywinrt (MIT). OS-provided engine, nothing else to bundle; ingest reports pages as unread without them.
    "pypdfium2>=4.30",
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gse-ai = "app.main:main"

[tool.setuptools]
# Import roots shipped with the service. rag/ and ingest/ are owned by rag-ingest; app/ and tools/ by ai-engineer.
packages = ["app", "tools", "rag", "ingest", "recommender", "vision", "voice"]

[tool.setuptools.package-data]
app = ["config.yaml"]

[tool.pytest.ini_options]
# Lets `rag`, `ingest`, `app`, `tools` import when pytest runs from ai-service/.
pythonpath = ["."]
