# ai-service default config (ADR-008; llama_server per ADR-012; routes per ADR-013). Owned by ai-engineer.
# The app launches the service with --port/--token (CLI overrides this file). These service.* values
# are standalone-run defaults only (dev/test: `python -m app.main`). installer-deploy ships a production copy
# to ai-service/config/config.yaml with the bundled llama-server and GGUF paths filled in.
service:
  host: 127.0.0.1            # never 0.0.0.0
  port: 8765                 # standalone default; the App overrides via --port at runtime
  token: "dev-local-token"   # standalone default; the App overrides via --token at runtime

# llama.cpp runtime (ADR-012). The service starts, watches and stops these processes itself, always on 127.0.0.1.
# binary empty = do not spawn: attach to a llama-server already listening on the ports below (dev and tests).
llama_server:
  binary: ""                 # e.g. {app}\llama.cpp\llama-server.exe (installer fills this in)
  subcommand: ""             # "serve" if the pinned build ships llama.exe with subcommands instead of llama-server.exe
  model: ""                  # chat GGUF: LFM3-Omni-2B Q4_K_M (~1.1 GB, Liquid's recommended balance)
  mmproj: ""                 # image/audio projector (mmproj-LFM3-Omni-2B-Q8_0.gguf); blank until Phase 7 uses it
  port: 8081
  ctx: 8192                  # our choice (Liquid's serve default is 4096): room for history + tool results
  threads: 0                 # 0 = llama.cpp default (Liquid lists no thread setting)
  extra_args: ["--reasoning", "off"]  # LFM3-Omni-2B is non-reasoning: model card says use --reasoning off
  start_timeout_s: 120       # cold load on a CPU tablet can be slow
  embedding:
    model: ""                # embedding GGUF, e.g. {app}\models\<nomic-embed-text>.gguf
    port: 8082
    pooling: mean            # must match the embedding model
    ctx: 2048
    extra_args: []

models:
  chat: "lfm3-omni"          # label only (llama-server --alias); config-only, never hardcoded in code
  embedding: "nomic-embed-text"
  embedding_dim: 768         # MUST match the vec0 dimension (fixed at 768); changing it means re-embedding
  chat_temperature: 0.0      # LFM3-Omni-2B model card: greedy decoding (temperature 0) for text

# Remote routes (ADR-013). Off by default. Keys are NEVER written here: key_name is a Windows Credential Manager
# entry (service "GSE Tech Pro AI"). The cloud is used only when enabled here AND the app's administrator allows it.
routes:
  shop_server:
    enabled: false
    model: ""                # e.g. litellm_proxy/<model on the shop proxy>
    api_base: ""             # e.g. http://shop-ai.local:4000
    key_name: ""             # Credential Manager entry holding the proxy's virtual key
  cloud:
    enabled: false
    model: ""                # LiteLLM provider/model; left blank until the owner picks one
    api_base: ""
    key_name: ""
    probe_host: ""           # host:port for the online check (TCP connect only)
  health_ttl_s: 15
  health_timeout_s: 1.5

idle_unload_minutes: 10      # stop the llama-server processes after idle (RAM budget)

degradation:
  offline_chat_message: "AI assistant is unavailable (the local model is not running). Manual search remains available."
  fallback_search: "bm25"    # when no embedding model: rank by FTS5 BM25 only (deterministic, no model)
