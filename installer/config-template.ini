; ============================================================================
; GSE Tech Pro — Silent Install Configuration Template
; 
; Usage: Copy this file, fill in values, then run:
;   GSE-Tech-Pro-Setup.exe /SILENT /CONFIG="C:\path\to\your-config.ini"
;
; For multi-tablet deployment via USB or Intune, create one config per shop
; and push it alongside the installer.
; ============================================================================

[install]
; Shop name — appears on work orders, printouts, and in the app header
shop_name = My Repair Shop

; Default unit system: "imperial" (psi, °F, mi) or "metric" (bar, °C, km)
default_unit_system = imperial

; Optional: Override default data directory. If blank, uses %APPDATA%\GSE Tech Pro\Data
data_dir = 

; Whether to install Ollama and the lfm3-omni model locally.
; Set to "false" if shops will use a remote AI server instead.
install_ollama_model = true

[technicians]
; Comma-separated list of technician names (display names only).
; Each name becomes a selectable technician in the app's dropdown.
list = John Smith,Jane Doe,Bob Johnson

[devices]
; Comma-separated list of connected diagnostic devices to pre-configure.
; Supported values: rlink-x3, nexiq-usb-link, noregon-dla+, picoscope, hantek-6074be
list = rlink-x3,picoscope
