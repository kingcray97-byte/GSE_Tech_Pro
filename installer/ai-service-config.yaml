# GSE Tech Pro AI service config, written by setup (installer/GSE-Tech-Pro-Setup.iss, WriteAiServiceConfig).
# Placeholders (@...@) are replaced with the bundled paths at install time. Shape: ai-service/app/config.yaml.
# NEVER put a key, token or password here (ADR-013): the service refuses to start if this file holds one.
service:
  host: 127.0.0.1
  port: 8765                 # the app passes --port/--token at launch

llama_server:                # ADR-012: started and stopped by the AI service, 127.0.0.1 only
  binary: @LLAMA_SERVER@     # pinned llama.cpp b12359 (= v1.0.0), Windows CPU x64 build
  subcommand: ''             # b12359 ships llama-server.exe, so no subcommand (checked 2026-11-19)
  model: @CHAT_MODEL@        # LFM3-Omni-2B Q4_K_M
  mmproj: ''                 # image/audio projector, added with Phase 7 (vision/voice)
  port: 8081
  ctx: 8192
  threads: 0
  extra_args: ['--reasoning', 'off']  # LFM3-Omni-2B is non-reasoning (Liquid model card)
  start_timeout_s: 120
  embedding:
    model: @EMBED_MODEL@
    port: 8082
    pooling: mean
    ctx: 2048
    extra_args: []

models:
  chat: "lfm3-omni"
  embedding: "nomic-embed-text"
  embedding_dim: 768
  chat_temperature: 0.0      # greedy decoding for text (Liquid model card)

routes:                      # ADR-013: off by default
  shop_server:
    enabled: @SHOP_SERVER_ENABLED@
    model: ""                # TODO: model name on the shop proxy (set by the shop's administrator)
    api_base: @SHOP_SERVER_URL@
    key_name: ""
  cloud:                     # the owner's hosted inference server (OpenAI-compatible REST API), ADR-013
    enabled: false           # an administrator turns this on once model and api_base are filled in
    model: ""                # TODO: "openai/<model name the server serves>" (openai/ = OpenAI-compatible API)
    api_base: ""             # TODO: https://<your server>/v1 (https required: the key is a Bearer token)
    key_name: "gse-cloud-api-key"  # Credential Manager entry holding the API key issued by the owner's website
    probe_host: ""           # blank = check the api_base host on port 443 (TCP connect only)
  health_ttl_s: 15
  health_timeout_s: 1.5

idle_unload_minutes: 10

degradation:
  offline_chat_message: "AI assistant is unavailable (the local model is not running). Manual search remains available."
  fallback_search: "bm25"
